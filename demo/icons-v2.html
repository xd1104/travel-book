<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>圖示 v2 — 換掉「突兀」的那兩顆</title>
<style>
/* ============================================================
   旅途手帳 — 圖示 v2 比較 demo
   底下的 App 樣式是從 public/styles.css 原樣搬過來的（真色票、真尺寸），
   墊的是 Benson 真的 Day 1 內容（本色季3rd）。
   只有 .map-btn 那兩顆會跟著方向切換，其他一律不動。
   ============================================================ */
:root{
  --bg:#f7f4ee; --card:#ffffff; --ink:#2b2620; --muted:#8f8578; --line:#e8e1d5;
  --acc:#ff6b5e; --acc-deep:#e2503f; --ok:#2fa87a; --bad:#d64545;
  --shadow:0 2px 14px rgba(70,55,30,.08);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0;}
body{background:#e9e4da;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  color:var(--ink);}
button{font-family:inherit; border:none; background:none; cursor:pointer; color:inherit; padding:0;}
h1,h2,h3,p,ul{margin:0;}

/* ---------- demo 控制列（不是 App 的一部分） ---------- */
.ux-bar{position:sticky; top:0; z-index:60; background:#231d16; color:#f4ece0; padding:9px 12px 10px;
  box-shadow:0 4px 16px rgba(0,0,0,.22);}
.ux-bar .row{max-width:480px; margin:0 auto; display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
.ux-bar .row + .row{margin-top:7px;}
.ux-lab{font-size:10.5px; letter-spacing:.16em; color:#9c907f; font-weight:800; flex:0 0 auto; width:34px;}
.ux-seg{flex:1; display:flex; gap:5px; min-width:0;}
.ux-seg button{flex:1; min-height:38px; border-radius:10px; background:#3a3227; color:#d9cfc0;
  font-size:12.5px; font-weight:700; line-height:1.25; padding:0 4px; white-space:nowrap;}
.ux-seg button.on{background:#f4ece0; color:#231d16;}
.ux-seg button b{display:block; font-size:12.5px;}
.ux-seg button i{display:block; font-style:normal; font-size:9.5px; opacity:.62; font-weight:600;}
.ux-star{position:absolute; margin:-16px 0 0 -6px; font-size:11px;}
.ux-toggle{flex:0 0 auto; min-height:38px; padding:0 11px; border-radius:10px; background:#3a3227;
  color:#d9cfc0; font-size:12px; font-weight:700;}
.ux-toggle.on{background:#c9704f; color:#fff;}

.ux-why{max-width:480px; margin:0 auto; background:#fffdf8; border-bottom:1px solid #e6dfd2;
  padding:12px 16px 14px; font-size:12.8px; line-height:1.62; color:#5d5548;}
.ux-why b{color:#2b2620; font-size:13.4px;}
.ux-why .tag{display:inline-block; background:#2fa87a; color:#fff; font-size:10.5px; font-weight:800;
  padding:2px 7px; border-radius:99px; margin-left:6px; vertical-align:2px;}
.ux-why .tag.now{background:#b6ab99;}
.ux-why ul{margin:7px 0 0; padding-left:16px;}
.ux-why li{margin-top:3px;}

/* ---------- 以下全部是 public/styles.css 的原樣拷貝 ---------- */
#app{max-width:480px; margin:0 auto; background:var(--bg); position:relative;}
.trip-head{padding:14px 18px 20px; color:#fff; border-radius:0 0 26px 26px;}
.head-top{display:flex; align-items:center; justify-content:space-between;}
.back-btn{display:inline-flex; align-items:center; gap:2px; color:#fff; font-size:15px; font-weight:600;
  min-height:44px; padding:0 10px 0 0; text-shadow:0 1px 6px rgba(0,0,0,.25);}
.head-edit{color:#fff; min-height:44px; padding:0 16px; border-radius:99px; background:rgba(255,255,255,.24);
  font-size:13.5px; font-weight:700; display:inline-flex; align-items:center; gap:4px;}
.trip-title{display:flex; align-items:center; gap:10px; margin-top:2px;}
.trip-title .emo{font-size:34px; filter:drop-shadow(0 2px 5px rgba(0,0,0,.25));}
.trip-title h1{font-size:24px; font-weight:800; text-shadow:0 1px 8px rgba(0,0,0,.3);}
.trip-sub{font-size:13px; opacity:.95; margin-top:6px; text-shadow:0 1px 6px rgba(0,0,0,.3);}
.tab-body{padding:16px 16px 40px;}

.day-bar{position:sticky; top:104px; z-index:5; background:linear-gradient(var(--bg) 78%, transparent);
  padding:10px 0 12px; display:flex; align-items:center; gap:8px;}
.day-chips{display:flex; gap:8px; overflow-x:auto; flex:1; padding:2px;}
.day-chips::-webkit-scrollbar{display:none;}
.day-chip{flex:0 0 auto; min-width:60px; min-height:52px; border-radius:14px; background:var(--card);
  box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;}
.day-chip b{font-size:14px;}
.day-chip span{font-size:11px; color:var(--muted);}
.day-chip.on{background:var(--ink); color:#fff;}
.day-chip.on span{color:#cfc8bd;}
.edit-toggle{flex:0 0 auto; min-height:44px; padding:0 14px; border-radius:12px; background:var(--card);
  box-shadow:var(--shadow); font-size:13.5px; font-weight:700; color:var(--muted);}
.edit-toggle.on{background:var(--acc); color:#fff;}

.stop{display:flex; gap:10px; margin-bottom:2px;}
.rail{width:22px; display:flex; flex-direction:column; align-items:center; flex:0 0 auto;}
.rail .dot{width:12px; height:12px; border-radius:50%; margin-top:18px; flex:0 0 auto; box-shadow:0 0 0 3px var(--bg);}
.rail .ln{width:2px; flex:1; background:var(--line); margin-top:2px;}
.stop:last-child .rail .ln{background:transparent;}
.stop-card{flex:1; background:var(--card); border-radius:16px; box-shadow:var(--shadow); padding:12px 14px; margin-bottom:12px; min-width:0;}
.stop-card.tappable:active{transform:scale(.985);}
.stop-top{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.stop-time{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;}
.stop-time .to{color:#a89e8f; font-weight:600;}
.cat-pill{font-size:12px; font-weight:700; padding:3px 9px; border-radius:99px;}
.map-btn{width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  margin:-10px -10px -8px auto; border-radius:12px; text-decoration:none;}
.map-btn .ico{width:22px; height:22px; fill:none; stroke:currentColor;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;}
.stop-card .map-btn{color:var(--acc-deep); background:#fff1ef;}
.stop-card .map-btn:active{background:#ffe3df;}
.stop-tools{margin-left:auto; display:flex; gap:8px;}
.tool-btn,.drag-handle{width:44px; height:44px; border-radius:12px; background:#f3eee4;
  display:flex; align-items:center; justify-content:center; font-size:18px; color:#6b6154; flex:0 0 auto;}
.tool-btn.danger{color:var(--bad); background:#fbeeee;}
.drag-handle{font-size:20px;}
.stop-name{font-size:16.5px; font-weight:700; margin-top:5px; overflow-wrap:anywhere;}
.stop-place{font-size:13px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:4px; overflow-wrap:anywhere;}
.stop-note{font-size:13.5px; color:#6b6154; background:#faf6ee; border-radius:10px; padding:8px 10px; margin-top:8px; line-height:1.5; overflow-wrap:anywhere;}

.transit-bar{flex:1; display:flex; align-items:center; gap:8px; min-width:0;
  background:#f1ece2; border-radius:11px; padding:7px 12px; margin-bottom:12px; min-height:38px;}
.transit-bar.tappable:active{background:#e9e3d6;}
.tr-ico{font-size:14px; flex:0 0 auto; opacity:.75;}
.tr-txt{flex:1; min-width:0; font-size:13px; color:#7a7265; overflow-wrap:anywhere; line-height:1.4;}
.transit-bar .stop-tools{margin-left:auto;}
.transit-bar .map-btn{width:38px; height:38px; flex:0 0 auto;
  margin:-7px -6px -7px auto; position:relative;
  color:var(--acc-deep); background:#fbeae7;}
.transit-bar .map-btn::before{content:""; position:absolute; inset:-3px;}
.transit-bar .map-btn:active{background:#f6ddd8;}
.transit-bar .map-btn .ico{width:19px; height:19px; stroke-width:1.9;}
.transit-bar .tool-btn,.transit-bar .drag-handle{width:38px; height:38px; font-size:16px; background:#e4ddcf;
  position:relative;}
.transit-bar .tool-btn::before,.transit-bar .drag-handle::before{content:""; position:absolute; inset:-3px;}
.stop.transit .rail .dot{width:7px; height:7px; margin-top:16px; background:transparent;
  border:1.5px solid #cdc3b2; box-shadow:none;}
.stop.transit .rail .ln{background:none;
  background-image:linear-gradient(#d8cfbf 55%, transparent 0);
  background-size:2px 7px; background-repeat:repeat-y;}
.btn-ghost{width:100%; min-height:52px; border-radius:15px; border:1.5px solid var(--line); background:#fbfaf6;
  display:flex; align-items:center; justify-content:center; gap:7px; font-size:15px; font-weight:700;
  color:#6b6154; text-decoration:none;}
.btn-ghost .ico{width:19px; height:19px; fill:none; stroke:currentColor; color:var(--acc-deep);
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; flex:0 0 auto;}

/* ============================================================
   ↓↓↓ 只有這一段是新的：三個方向 ↓↓↓
   ============================================================ */

/* ---- A 留白｜完全沒有底色，只留一個記號 ---- */
.sty-a .stop-card .map-btn{background:none; color:#a89d8d; margin:-10px -11px -8px auto;}
.sty-a .stop-card .map-btn:active{background:#f4efe5;}
.sty-a .stop-card .map-btn .ico{width:21px; height:21px; stroke-width:1.6;}
.sty-a .transit-bar .map-btn{background:none; color:#9a9082; margin:-7px -7px -7px auto;}
.sty-a .transit-bar .map-btn:active{background:#e6dfd1;}
.sty-a .transit-bar .map-btn .ico{width:18px; height:18px; stroke-width:1.7;}

/* ---- B 米灰圓鈕｜跟 .tool-btn 同家族，縮到跟藥丸同一階 ---- */
.sty-b .stop-card .map-btn{width:32px; height:32px; border-radius:50%; background:#f3eee4; color:#877d6d;
  margin:-4px -2px -4px auto; position:relative;}
.sty-b .stop-card .map-btn::before{content:""; position:absolute; inset:-6px;}
.sty-b .stop-card .map-btn:active{background:#e9e1d2;}
.sty-b .stop-card .map-btn .ico{width:18px; height:18px; stroke-width:1.75;}
.sty-b .transit-bar .map-btn{width:28px; height:28px; border-radius:50%; background:#e5ded0; color:#7d7466;
  margin:-2px -1px -2px auto;}
.sty-b .transit-bar .map-btn::before{inset:-8px;}
.sty-b .transit-bar .map-btn:active{background:#dad2c1;}
.sty-b .transit-bar .map-btn .ico{width:16px; height:16px; stroke-width:1.85;}

/* ---- C 貼著內容走｜卡片：跟在名字後面；灰條：右邊一個「路線」淡字 ---- */
.map-btn.at-name{display:none;}
.sty-c .map-btn.at-top{display:none;}
.sty-c .stop-card .map-btn.at-name{display:inline-flex; position:relative; width:auto; height:auto;
  background:none; color:#a89d8d; margin:0 0 0 7px; vertical-align:-3px; border-radius:9px;}
.sty-c .stop-card .map-btn.at-name::before{content:""; position:absolute; inset:-12px;}
.sty-c .stop-card .map-btn.at-name:active{color:#7f7565;}
.sty-c .stop-card .map-btn.at-name .ico{width:19px; height:19px; stroke-width:1.7;}
.mb-lbl{display:none;}
.sty-c .transit-bar .map-btn.at-top{display:flex; width:auto; height:auto; min-height:38px; gap:4px;
  background:none; color:#7c7365; margin:-7px -2px -7px auto; padding:0 2px 0 8px; border-radius:9px;}
.sty-c .transit-bar .map-btn.at-top:active{color:#514a3f;}
.sty-c .transit-bar .map-btn .ico{width:15px; height:15px; stroke-width:1.9;}
.sty-c .transit-bar .mb-lbl{display:inline; font-size:12.5px; font-weight:700; letter-spacing:.02em;}
.sty-c .transit-bar .mb-lbl::after{content:" ›"; color:#b5aa99;}

/* ---- 圖形組切換（三組 glyph 疊在同一顆鈕裡，用 body class 顯示一組） ---- */
.ico{display:none;}
body.g1 .ico.g1, body.g2 .ico.g2, body.g3 .ico.g3{display:block;}

/* ---- 底部並排比較 ---- */
.side{max-width:480px; margin:0 auto; background:#efe9df; padding:18px 14px 40px;}
.side h3{font-size:14px; font-weight:800; color:#5d5548; margin-bottom:4px;}
.side > p{font-size:12px; color:#867c6d; margin-bottom:12px; line-height:1.5;}
.mini{background:var(--bg); border-radius:16px; padding:10px 12px 2px; margin-bottom:12px;
  box-shadow:0 1px 6px rgba(70,55,30,.07);}
.mini .lb{font-size:11.5px; font-weight:800; color:#8a8072; letter-spacing:.06em; margin-bottom:6px;}
.mini .lb em{font-style:normal; color:#2fa87a;}
.mini .stop-card{margin-bottom:10px;}
.mini .transit-bar{margin-bottom:10px;}
.ghost-wrap{max-width:480px; margin:0 auto; background:#efe9df; padding:0 14px 34px;}
.ghost-wrap h3{font-size:14px; font-weight:800; color:#5d5548; margin-bottom:4px;}
.ghost-wrap p{font-size:12px; color:#867c6d; margin-bottom:10px; line-height:1.5;}
.ghost-box{background:#fff; border-radius:16px; padding:14px;}
.foot{max-width:480px; margin:0 auto; background:#efe9df; padding:0 16px 60px; font-size:12px;
  color:#8a8072; line-height:1.7;}
.foot b{color:#5d5548;}
</style>
</head>
<body class="g1">

<div class="ux-bar">
  <div class="row">
    <span class="ux-lab">樣式</span>
    <div class="ux-seg" id="segSty"></div>
  </div>
  <div class="row">
    <span class="ux-lab">圖形</span>
    <div class="ux-seg" id="segGly"></div>
    <button class="ux-toggle" id="btnEdit">調整</button>
  </div>
</div>

<div class="ux-why" id="why"></div>

<div id="app" class="sty-cur"></div>

<div class="side">
  <h3>四個放在一起看</h3>
  <p>同一張卡（秀水湯包）＋同一條灰條，只有那兩顆不一樣。</p>
  <div id="sideBox"></div>
</div>

<div class="ghost-wrap">
  <h3>詳細頁的「開啟 Google 地圖」</h3>
  <p>這顆吃的是同一組圖形（大頭針），本來就是描邊、不受配色方向影響。</p>
  <div class="ghost-box" id="ghostBox"></div>
</div>

<div class="foot">
  <b>不動的東西：</b>類別藥丸、旅程封面、tab、灰條左邊的 🚶、地點行的 📍、✕ ☰ ✎ ＋ 一顆都沒改。<br>
  <b>命中區：</b>四個方向的可點範圍都還是 44×44（B、C 用 <code>::before</code> 外擴），灰條總高仍是 38px。<br>
  <b>調整模式：</b>按右上「調整」，這兩顆一樣不顯示（既有行為）。
</div>

<script>
/* ---------------- 圖形三組 ---------------- */
var GLY = {
  /* G1 = 現在線上這組 */
  pin1:'<circle cx="12" cy="10.4" r="2.4"/><path d="M12 21.2c4.2-4.5 6.3-8 6.3-10.6a6.3 6.3 0 1 0-12.6 0c0 2.6 2.1 6.1 6.3 10.6Z"/>',
  rt1 :'<circle cx="6.2" cy="18.4" r="2.6"/><path d="M6.2 15.8V11.4A3.4 3.4 0 0 1 9.6 8h7.3"/><path d="M14.4 5.5 17.3 8l-2.9 2.5"/>',
  /* G2 = 全圓角、零尖角：折頁地圖 ／ 一條蜿蜒的路 */
  pin2:'<path d="M3.4 7.6 9 5.2 15 7.8 20.6 5.4V16.4L15 18.8 9 16.2 3.4 18.6Z"/><path d="M9 5.2v11M15 7.8v11"/>',
  rt2 :'<circle cx="5.9" cy="18.5" r="2.3"/><circle cx="18.1" cy="5.5" r="2.3"/><path d="M5.9 16.2c0-3.4 3.1-3.9 6.1-4.6s6.1-1.4 6.1-3.8"/>',
  /* G3 = 極簡幾何：定位準心 ／ 導航指標 */
  pin3:'<circle cx="12" cy="12" r="6.9"/><circle cx="12" cy="12" r="1.9"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3"/>',
  rt3 :'<path d="M20.4 4.3 4.9 10.5c-.8.3-.8 1.5.1 1.7l5.6 1.5 1.5 5.6c.2.9 1.4.9 1.7.1Z"/>'
};
function svg(a,b,c){
  return '<svg viewBox="0 0 24 24" class="ico g1" aria-hidden="true" focusable="false">'+a+'</svg>'
       + '<svg viewBox="0 0 24 24" class="ico g2" aria-hidden="true" focusable="false">'+b+'</svg>'
       + '<svg viewBox="0 0 24 24" class="ico g3" aria-hidden="true" focusable="false">'+c+'</svg>';
}
var PIN   = svg(GLY.pin1, GLY.pin2, GLY.pin3);
var ROUTE = svg(GLY.rt1,  GLY.rt2,  GLY.rt3);

/* ---------------- Benson 真的 Day 1（本色季3rd・2026-08-29） ---------------- */
var CATS = {
  sight:{label:"景點",emoji:"📍",color:"#0d9488"},
  food :{label:"美食",emoji:"🍜",color:"#ea8600"},
  stay :{label:"住宿",emoji:"🏨",color:"#8b5cf6"},
  other:{label:"其他",emoji:"✨",color:"#7a7265"}
};
var DAY1 = [
  {t:"stop", time:"05:00", cat:"other", title:"出發", map:false},
  {t:"transit", txt:"開車・3 小時", route:false},
  {t:"stop", time:"08:00", to:"08:40", cat:"food", title:"秀水湯包", note:"要先打電話訂", map:true},
  {t:"transit", txt:"開車・2 小時", route:true},
  {t:"stop", time:"10:40", to:"10:55", cat:"food", title:"好難吃養生紫米海苔飯捲", place:"桃園", map:true},
  {t:"transit", txt:"開車・40 分", route:true},
  {t:"stop", time:"11:00", to:"11:30", cat:"stay", title:"沐楓商旅", map:true},
  {t:"transit", txt:"開車・30 分", route:false},
  {t:"stop", time:"12:00", to:"21:00", cat:"sight", title:"桃園陽光劇場", map:false},
  {t:"stop", time:"22:00", cat:"food", title:"夜市 ( 宵夜 )", note:"中原 ? 中壢 ?", map:false}
];

var edit = false;

function tools(){
  return '<span class="stop-tools">'
    + '<button class="tool-btn danger" aria-label="刪除">✕</button>'
    + '<button class="drag-handle" aria-label="拖曳排序">☰</button></span>';
}
function timeHtml(s){
  return '<span class="stop-time">'+s.time+(s.to?'<span class="to">–'+s.to+'</span>':'')+'</span>';
}
function renderItem(s, last){
  if(s.t==="transit"){
    var dir = (!edit && s.route)
      ? '<a class="map-btn at-top" href="#" onclick="return false" aria-label="看這一段路線">'
        + ROUTE + '<span class="mb-lbl">路線</span></a>' : "";
    return '<div class="stop transit">'
      + '<div class="rail"><span class="dot"></span><span class="ln'+(last?" last":"")+'"></span></div>'
      + '<div class="transit-bar'+(edit?"":" tappable")+'">'
      +   '<span class="tr-ico">🚶</span><span class="tr-txt">'+s.txt+'</span>'
      +   dir + (edit?tools():"")
      + '</div></div>';
  }
  var c = CATS[s.cat];
  var pinTop = (!edit && s.map)
    ? '<a class="map-btn at-top" href="#" onclick="return false" aria-label="在地圖上看這個地點">'+PIN+'</a>' : "";
  var pinName = (!edit && s.map)
    ? '<a class="map-btn at-name" href="#" onclick="return false" aria-label="在地圖上看這個地點">'+PIN+'</a>' : "";
  return '<div class="stop">'
    + '<div class="rail"><span class="dot" style="background:'+c.color+'"></span><span class="ln"></span></div>'
    + '<div class="stop-card'+(edit?"":" tappable")+'">'
    +   '<div class="stop-top">'+timeHtml(s)
    +     '<span class="cat-pill" style="color:'+c.color+'; background:'+c.color+'1a">'+c.emoji+' '+c.label+'</span>'
    +     (edit?tools():pinTop) + '</div>'
    +   '<div class="stop-name">'+s.title+pinName+'</div>'
    +   (s.place?'<div class="stop-place">📍 '+s.place+'</div>':"")
    +   (s.note?'<div class="stop-note">'+s.note+'</div>':"")
    + '</div></div>';
}

function render(){
  var items = DAY1.map(function(s,i){ return renderItem(s, i===DAY1.length-1); }).join("");
  document.getElementById("app").innerHTML =
      '<div class="trip-head" style="background:linear-gradient(135deg,#38c3a7,#2f8fd6)">'
    +   '<div class="head-top"><span class="back-btn">‹ 旅程</span><span class="head-edit">✎ 編輯</span></div>'
    +   '<div class="trip-title"><span class="emo">🚕</span><h1>本色季3rd</h1></div>'
    +   '<div class="trip-sub">桃園・8/29–8/31・3 天</div>'
    + '</div>'
    + '<div class="tab-body">'
    +   '<div class="day-bar"><div class="day-chips">'

  /* 底部並排 */

var GLYS = [
  {cls:"g1", name:"1 現行", sub:"水滴／轉彎箭頭"},

  {cls:"g3", name:"3 幾何", sub:"準心／導航指標"}
];

var curSty = 0, curGly = 0;

function buildSegs(){
  document.getElementById("segSty").innerHTML = STY.map(function(s,i){
    return '<button onclick="setSty('+i+')" class="'+(i===curSty?"on":"")+'" data-i="'+i+'">'
      + '<b>'+s.short+'</b><i>'+s.sub+'</i></button>';
  }).join("");
  document.getElementById("segGly").innerHTML = GLYS.map(function(g,i){
    return '<button onclick="setGly('+i+')" class="'+(i===curGly?"on":"")+'" data-i="'+i+'">'
      + '<b>'+g.name+'</b><i>'+g.sub+'</i></button>';
  }).join("");
}
function setSty(i){
  curSty = i;
  document.getElementById("app").className = STY[i].cls;
  document.getElementById("why").innerHTML = STY[i].why;
  buildSegs();
}
function setGly(i){
  curGly = i;
  document.body.className = GLYS[i].cls;
  buildSegs();
}
function toggleEdit(){ edit = !edit; document.getElementById("btnEdit").className = "ux-toggle"+(edit?" on":""); render(); }
document.getElementById("btnEdit").onclick = toggleEdit;

buildSegs();
setSty(0);
setGly(0);
render();
